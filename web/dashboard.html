<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity 用量看板</title>
  <link rel="stylesheet" href="dashboard.css">
  <script defer src="dashboard.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <div><h1>Antigravity 用量</h1><p id="state" role="status">正在读取本机记录…</p></div>
      <div class="toolbar"><button id="refresh">刷新</button><button id="close-dashboard" hidden aria-label="关闭用量看板" title="关闭（Esc）">×</button></div>
    </header>
    <nav class="tabs" role="tablist" aria-label="用量视图">
      <button id="history-tab" role="tab" aria-selected="true" aria-controls="history">用量趋势</button>
      <button id="session-tab" role="tab" aria-selected="false" aria-controls="session-panel" tabindex="-1">会话</button>
      <button id="quota-tab" role="tab" aria-selected="false" aria-controls="quota-panel" tabindex="-1">模型额度</button>
    </nav>

    <section id="session-panel" role="tabpanel" aria-labelledby="session-tab" hidden>
      <div class="section-header">
        <div><h2 id="session-title">会话用量</h2><p id="session-hint" class="muted">默认显示最近产生用量的会话。</p></div>
        <label class="picker">会话<select id="session"><option value="">最近活跃会话</option></select></label>
      </div>
      <div id="session-metrics" class="metrics"></div>
      <details><summary>最近 20 次模型调用</summary>
        <div class="scroll"><table><thead><tr><th>时间</th><th>模型</th><th>未缓存输入</th><th>缓存读取</th><th>输出</th><th>生成速率</th></tr></thead><tbody id="recent"></tbody></table></div>
      </details>
    </section>

    <section id="history" role="tabpanel" aria-labelledby="history-tab">
      <form id="filters" class="toolbar">
        <div class="presets" aria-label="快速日期筛选"><button type="button" data-days="1" aria-pressed="false">今天</button><button type="button" data-days="7" aria-pressed="false">近 7 天</button><button type="button" data-days="30" aria-pressed="false">近 30 天</button><button type="button" data-days="0" aria-pressed="true">全部</button></div>
        <label>开始<input id="start" type="date"></label>
        <label>结束<input id="end" type="date"></label>
        <label class="checkbox"><input type="checkbox" id="only">仅所选会话</label>
        <button type="submit" class="primary">筛选</button>
      </form>
      <div id="history-metrics" class="metrics"></div>
      <figure>
        <figcaption><h2>每日 Token 用量</h2><span id="chart-caption">—</span></figcaption>
        <div id="chart" class="chart" aria-label="每日 Token 用量"></div>
      </figure>
      <div class="scroll"><table><thead><tr><th>日期</th><th>Token 总量</th><th>缓存命中率</th><th>参考费用（USD）</th><th>参考费用（CNY）</th><th>USD/CNY · 汇率日期</th></tr></thead><tbody id="daily"></tbody></table></div>
      <details><summary>按模型查看</summary>
        <div class="scroll"><table><thead><tr><th>模型</th><th>调用次数</th><th>Token 总量</th><th>已计价 Token</th><th>USD</th><th>CNY</th></tr></thead><tbody id="models"></tbody></table></div>
      </details>
      <footer><p id="coverage">本机 Antigravity 桌面端 · UTC+08:00</p><p id="pricing"></p><p id="latest-fx" hidden></p><p>Google Cloud Global 标准 API 参考价 · Frankfurter 历史汇率</p></footer>
    </section>

    <section id="quota-panel" role="tabpanel" aria-labelledby="quota-tab" hidden>
      <div class="section-header"><div><h2 id="quota-title">模型额度</h2><p id="quota-status" class="muted"></p></div></div>
      <div class="scroll"><table><thead><tr><th>额度组</th><th>周期</th><th>剩余额度</th><th>重置时间（UTC+08:00）</th></tr></thead><tbody id="quota"></tbody></table></div>
    </section>
  </main>
</body>
</html>
