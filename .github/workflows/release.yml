name: release

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build portable package
        run: python build_release.py
      - name: Build source update package
        run: python -c "import json,release; v=json.load(open('plugin.json',encoding='utf-8'))['version']; release.build_source_zip(v)"
      - name: Show artifacts
        run: dir dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*-win-x64.zip
            dist/*-win-x64.zip.sha256
            dist/*-source-update.zip
